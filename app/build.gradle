plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

// Read API key from local.properties (gitignored)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.palmreader.astro'
    compileSdk 34

    defaultConfig {
        applicationId "com.palmreader.astro"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "4.0"

        // AI configuration from local.properties
        // Prefer proxy in release builds; direct key is for local testing only.
        buildConfigField "String", "OPENAI_API_KEY", "\"${localProperties.getProperty('OPENAI_API_KEY', 'YOUR_API_KEY_HERE')}\""
        buildConfigField "String", "OPENAI_PROXY_URL", "\"${localProperties.getProperty('OPENAI_PROXY_URL', '')}\""
        buildConfigField "String", "OPENAI_PROXY_TOKEN", "\"${localProperties.getProperty('OPENAI_PROXY_TOKEN', '')}\""
        buildConfigField "boolean", "ALLOW_DIRECT_OPENAI", "${localProperties.getProperty('ALLOW_DIRECT_OPENAI', 'false')}"
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"${localProperties.getProperty('PRIVACY_POLICY_URL', '')}\""
        buildConfigField "String", "TERMS_URL", "\"${localProperties.getProperty('TERMS_URL', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Room DB
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Google Sign-In
    // Note: Configure OAuth 2.0 client in Google Cloud Console + add app SHA-1 fingerprint
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
